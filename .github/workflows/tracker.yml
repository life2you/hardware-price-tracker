name: Daily Hardware Price Tracker

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动定时执行
    - cron: '0 20 * * *'
  # 支持在 GitHub 页面上随时点击“Run workflow”手动触发测试
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须授予写入权限，用于 push 回仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Price Crawler
        run: npm start

      - name: Commit and Push Price Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore(data): auto-update hardware prices [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
